<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P GitHub Pages Chat</title>
    <!-- Load PeerJS library directly in browser -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
        #messages { border: 1px solid #ccc; height: 250px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; list-style: none; }
        .box { background: #f0f0f0; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>GitHub Pages P2P Chat</h2>
    
    <div class="box">
        <p><strong>Your ID:</strong> <span id="my-id">Connecting...</span></p>
        <input id="friend-id" type="text" placeholder="Paste Friend's ID here">
        <button onclick="connectToFriend()">Connect to Friend</button>
    </div>

    <ul id="messages"></ul>

    <div style="display:flex;">
        <input id="input" style="flex-grow:1; padding:10px;" placeholder="Type a message..." />
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        // Initialize PeerJS (uses their free public cloud handshake server)
        const peer = new Peer();
        let conn = null;

        // Display your unique ID when it generates
        peer.on('open', (id) => {
            document.getElementById('my-id').textContent = id;
        });

        // Listen for your friend connecting to you
        peer.on('connection', (connection) => {
            conn = connection;
            setupChat();
        });

        // Connect to your friend using their ID
        function connectToFriend() {
            const fId = document.getElementById('friend-id').value;
            conn = peer.connect(fId);
            setupChat();
        }

        // Set up the message listeners once connected
        function setupChat() {
            appendMessage("System: Connected to peer!");
            conn.on('data', (data) => {
                appendMessage("Friend: " + data);
            });
        }

        // Send a text message over the peer connection
        function sendMessage() {
            const input = document.getElementById('input');
            if (conn && input.value) {
                conn.send(input.value);
                appendMessage("You: " + input.value);
                input.value = '';
            }
        }

        function appendMessage(text) {
            const msgList = document.getElementById('messages');
            const item = document.createElement('li');
            item.textContent = text;
            msgList.appendChild(item);
        }
    </script>
</body>
</html>
